name: Verificar projeto
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verificacoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tests/calculos.cjs
      - run: node tests/componentes.cjs
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m compileall -q tools
      - run: python tools/build_frontend.py
        env:
          SUPABASE_URL: https://exemplo.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_EXEMPLO_SINTETICO_TESTES
